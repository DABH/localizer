[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskctl-demo"
version = "0.0.0"
description = "A small Typer CLI that uses Localizer."
requires-python = ">=3.10"
dependencies = ["typer>=0.17", "localizer"]

[project.scripts]
taskctl = "taskctl.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["taskctl"]

# Developing against this checkout; a real project depends on the published localizer package.
[tool.uv.sources]
localizer = { path = "../..", editable = true }
