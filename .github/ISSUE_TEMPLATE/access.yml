name: Request access to the hosted service
description: Ask to enable Localizer's hosted translation service for a public repository.
title: "Access request: "
body:
  - type: markdown
    attributes:
      value: |
        Localizer's hosted service is in private preview and serves public repositories only.
        Everything you enter here is public.
  - type: input
    id: repository
    attributes:
      label: Repository
      description: The public repository of your Go CLI.
      placeholder: https://github.com/your-org/your-cli
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: How do you want to connect it?
      options:
        - GitHub Action
        - GitHub App
        - Not sure yet
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Languages you need, how your CLI prints its output, questions.
