# Dependency updates: grouped, weekly, for every ecosystem in the repository.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups: { go: { patterns: ["*"] } }
    ignore:
      # The x/ modules raise the module's minimum Go version with every minor release; those bumps are
      # made by hand together with the go directive (see CONTRIBUTING).
      - dependency-name: "golang.org/x/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: pip
    directory: /python
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups: { site: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
