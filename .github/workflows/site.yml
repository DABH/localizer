name: site
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Check file types
        # The locale.dev CDN serves a request as a file only when its extension is on this list (the
        # request function in the service's site template); any other URL is treated as a page. A new
        # kind of asset has to be added there first.
        run: |
          allowed='html|css|js|mjs|json|xml|txt|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|wasm|map|pdf|webmanifest|pagefind|pf_fragment|pf_index|pf_meta|pf_filter'
          if unknown=$(find dist -type f | grep -vE "\.($allowed)$"); then
            echo "::error::These files have an extension the CDN doesn't serve as a file; add it to the CDN function, then to this list:"
            echo "$unknown"
            exit 1
          fi
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/dist
          retention-days: 7

  deploy:
    # Publishes https://locale.dev (S3 + CloudFront) with an AWS role that only this repository's
    # "locale.dev" environment, which deploys from main, can assume with its OIDC token.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: locale.dev
      url: https://locale.dev/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload
        env:
          BUCKET: ${{ secrets.SITE_BUCKET }}
        run: |
          # Hashed assets never change; everything else is revalidated after five minutes.
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "_astro/*" --cache-control "public, max-age=300"
      - name: Invalidate the CDN
        env:
          DISTRIBUTION: ${{ secrets.SITE_DISTRIBUTION_ID }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"
      - name: Verify
        run: |
          for p in / /getting-started/ /reference/runtime/; do
            curl -fsS "https://locale.dev$p" | grep -q '<title>' || { echo "::error::https://locale.dev$p did not serve a page"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' https://locale.dev/no-such-page/)" = 404
          test "$(curl -s -o /dev/null -w '%{redirect_url}' https://locale.dev/getting-started)" = https://locale.dev/getting-started/
          test "$(curl -s -o /dev/null -w '%{redirect_url}' 'https://www.locale.dev/faq/?a=1')" = 'https://locale.dev/faq/?a=1'
