name: pypi
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['python/**', '.github/workflows/pypi.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs reads the version from the tag
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A tag build must never come out as a dev version.
            export SETUPTOOLS_SCM_PRETEND_VERSION="${GITHUB_REF_NAME#v}"
          fi
          uv build python/ --out-dir dist
          uv build python/alias --out-dir dist-alias
      - name: Smoke-test the wheels
        run: |
          uv venv --python 3.10 smoke
          uv pip install --python smoke/bin/python dist/*.whl
          smoke/bin/python -c 'import localizer, localizer.builtin as b; print(localizer.__version__, b.languages())'
          # The alias depends on the release being built, which isn't on PyPI yet: check its metadata only.
          uv pip install --python smoke/bin/python --no-deps dist-alias/*.whl
          smoke/bin/python -c 'import importlib.metadata as m; d = m.metadata("localizer-py"); print(d["Name"], d["Version"], d.get_all("Requires-Dist"))'
      - name: Both packages carry the tag's version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          smoke/bin/python - <<'EOF'
          import importlib.metadata as m, os, sys
          expected = os.environ["TAG"].removeprefix("v")
          built = {name: m.version(name) for name in ("localizer", "localizer-py")}
          print(built)
          wrong = {name: v for name, v in built.items() if v != expected}
          if wrong:
              sys.exit(f"::error::built version differs from tag v{expected}: {wrong}")
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            dist-alias/

  test:
    # The tests run against the built wheel, not python/localizer: the wheel goes into a fresh environment,
    # and pytest runs from the repository root (the tests read testdata/conformance), where python/ is not
    # on sys.path, in a process that first asserts that `import localizer` resolved to the wheel.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: built
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install the wheel
        run: |
          uv venv --python ${{ matrix.python }} wheel-env
          uv pip install --python wheel-env/bin/python built/dist/*.whl pytest typer click
          wheel-env/bin/python -c 'import localizer; print(localizer.__version__)'
      - name: Test the wheel
        run: |
          wheel-env/bin/python - <<'EOF'
          import sys
          import localizer, pytest
          assert "site-packages" in localizer.__file__, localizer.__file__
          print("testing", localizer.__file__)
          sys.exit(pytest.main(["python/tests", "-q", "-p", "no:cacheprovider"]))
          EOF

  release-guard:
    # Only tags on main are released: the tagged commit has to be an ancestor of origin/main.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at ${GITHUB_SHA:0:7}, which is not on main: not publishing."
            exit 1
          fi

  # Trusted publishing: PyPI accepts this repository's OIDC token for the "pypi" environment on the localizer
  # project and for "pypi-alias" on localizer-py; no API token is stored anywhere.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, release-guard]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/localizer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  publish-alias:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish # the alias depends on the release above being available
    runs-on: ubuntu-latest
    environment:
      name: pypi-alias
      url: https://pypi.org/p/localizer-py
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-alias/
