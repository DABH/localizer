name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make fmt-check vet

  python:
    # The Python runtime, across the framework generations it hooks (Typer 0.17 uses real Click;
    # Typer 0.26+ bundles its own copy), the Python versions that hand Click raw docstrings (3.10-3.12)
    # and the operating systems whose language settings it reads.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", deps: "typer==0.17.3 click==8.1.8 rich==14.0.0" }
          - { os: ubuntu-latest, python: "3.11", deps: "typer==0.26.8" }
          - { os: ubuntu-latest, python: "3.12", deps: "click==8.1.7" }
          - { os: ubuntu-latest, python: "3.13", deps: "typer==0.27.2 click==8.5.0" }
          - { os: ubuntu-latest, python: "3.14", deps: "click==8.5.0" }
          - { os: ubuntu-latest, python: "3.14", deps: "" }
          - { os: macos-latest, python: "3.13", deps: "typer==0.27.2" }
          - { os: windows-latest, python: "3.13", deps: "typer==0.17.3 click==8.1.8 rich==14.0.0" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv -e "python[test]" ${{ matrix.deps }}
      - name: Test
        shell: bash
        run: uv run --python .venv --no-project pytest python/tests -q

  cla-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test .github/cla/cla.test.js

  cobra-compat:
    # The runtime requires cobra >= v1.8 but must keep working with the newest release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: |
          go get github.com/spf13/cobra@latest
          go test ./...
